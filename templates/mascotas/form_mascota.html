{% extends "base.html" %}

{% block title %}{{ titulo }} - VetTurnos{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h2>🐾 {{ titulo }}</h2>
            <p>Completá los datos de tu mascota (animales chicos: perros y gatos).</p>
        </div>

        <form method="POST" class="styled-form">
            <div class="form-group">
                <label for="nombre">Nombre de la Mascota: *</label>
                <input type="text" id="nombre" name="nombre" value="{{ mascota.nombre if mascota else '' }}" required placeholder="Ej: Milo, Luna, Rocco">
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="especie">Especie: *</label>
                    <select id="especie" name="especie" required>
                        <option value="" disabled {% if not mascota %}selected{% endif %}>Seleccionar especie...</option>
                        <option value="Perro" {% if mascota and mascota.especie == 'Perro' %}selected{% endif %}>Perro 🐶</option>
                        <option value="Gato" {% if mascota and mascota.especie == 'Gato' %}selected{% endif %}>Gato 🐱</option>
                        <option value="Otro" {% if mascota and mascota.especie not in ['Perro', 'Gato'] %}selected{% endif %}>Otro animal chico 🐾</option>
                    </select>
                </div>

                <div class="form-group col">
                    <label for="raza">Raza:</label>
                    <input type="text" id="raza" name="raza" value="{{ mascota.raza if mascota and mascota.raza != 'No especificado' else '' }}" placeholder="Ej: Mestizo, Caniche, Siamés">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="peso">Peso (kg):</label>
                    <input type="text" id="peso" name="peso" value="{{ mascota.peso if mascota and mascota.peso and mascota.peso != 'No especificado' else '' }}" placeholder="Ej: 8.5 kg, 12 kg">
                </div>

                <div class="form-group col">
                    <label for="genero">Género:</label>
                    <select id="genero" name="genero">
                        <option value="" {% if not mascota or not mascota.genero or mascota.genero == 'No especificado' %}selected{% endif %}>Seleccionar género...</option>
                        <option value="Macho" {% if mascota and mascota.genero == 'Macho' %}selected{% endif %}>Macho ♂</option>
                        <option value="Hembra" {% if mascota and mascota.genero == 'Hembra' %}selected{% endif %}>Hembra ♀</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="edad">Edad aproximada:</label>
                <input type="text" id="edad" name="edad" value="{{ mascota.edad if mascota and mascota.edad != 'No especificado' else '' }}" placeholder="Ej: 3 años, 6 meses">
            </div>

            <div class="form-group">
                <label for="observaciones">Observaciones clínicas o antecedentes:</label>
                <textarea id="observaciones" name="observaciones" rows="3" placeholder="Alergias, tratamientos previos, temperamento, etc.">{{ mascota.observaciones if mascota else '' }}</textarea>
            </div>

            <div class="form-buttons">
                <a href="{{ url_for('mascotas.mis_mascotas') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">{{ accion }} Mascota</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
