{% extends "base.html" %}

{% block title %}Crear Cuenta - VetTurnos{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h2>📝 Crear Cuenta</h2>
            <p>Registrate como cliente para poder agendar turnos para tus mascotas.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.registro') }}" class="styled-form">
            <div class="form-row">
                <div class="form-group col">
                    <label for="nombre">Nombre: *</label>
                    <input type="text" id="nombre" name="nombre" value="{{ nombre or '' }}" required placeholder="Juan">
                </div>
                <div class="form-group col">
                    <label for="apellido">Apellido: *</label>
                    <input type="text" id="apellido" name="apellido" value="{{ apellido or '' }}" required placeholder="Pérez">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico: *</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="juan@correo.com">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono / WhatsApp:</label>
                <input type="tel" id="telefono" name="telefono" value="{{ telefono or '' }}" placeholder="11 1234-5678">
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="password">Contraseña: *</label>
                    <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group col">
                    <label for="password_confirm">Confirmar Contraseña: *</label>
                    <input type="password" id="password_confirm" name="password_confirm" required placeholder="Repetir contraseña">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Registrarme</button>
        </form>

        <div class="form-footer">
            <p>¿Ya tenés una cuenta? <a href="{{ url_for('auth.login') }}">Iniciá sesión acá</a></p>
        </div>
    </div>
</div>
{% endblock %}
