{% extends "base.html" %}

{% block title %}Mi Perfil - VetTurnos{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h2>👤 Mi Perfil</h2>
            <p>Consultá y actualizá tus datos personales de contacto.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.perfil') }}" class="styled-form">
            <div class="form-row">
                <div class="form-group col">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
                </div>
                <div class="form-group col">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" value="{{ usuario.apellido }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" value="{{ usuario.email }}" disabled class="input-disabled">
                <small class="text-muted">El correo electrónico no puede ser modificado por seguridad.</small>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono / WhatsApp:</label>
                <input type="tel" id="telefono" name="telefono" value="{{ usuario.telefono or '' }}">
            </div>

            <hr class="divider">

            <div class="form-group">
                <label for="nueva_password">Cambiar Contraseña (opcional):</label>
                <input type="password" id="nueva_password" name="nueva_password" placeholder="Dejar en blanco si no querés cambiarla">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}
